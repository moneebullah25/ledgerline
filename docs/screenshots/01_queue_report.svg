<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="'Menlo','Consolas','Monaco',monospace" font-size="13">
  <rect width="860" height="320" rx="10" fill="#1e1e2e"/>
  <!-- title bar -->
  <rect width="860" height="32" rx="10" fill="#313244"/>
  <rect y="22" width="860" height="10" fill="#313244"/>
  <circle cx="20" cy="16" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="16" r="6" fill="#a6e3a1"/>
  <circle cx="60" cy="16" r="6" fill="#f9e2af"/>
  <text x="430" y="21" text-anchor="middle" fill="#cdd6f4" font-size="12">Terminal — POST /v1/reports</text>
  <!-- prompt line -->
  <text x="20" y="62" fill="#a6e3a1">$</text>
  <text x="32" y="62" fill="#cdd6f4">curl -X POST http://localhost:8000/v1/reports \</text>
  <text x="32" y="80" fill="#cdd6f4">  -H "X-API-Key: $LEDGERLINE_API_KEY" \</text>
  <text x="32" y="98" fill="#cdd6f4">  -H "Content-Type: application/json" \</text>
  <text x="32" y="116" fill="#cdd6f4">  -d '{"ticker": "NVDA", "fiscal_year": 2025, "fiscal_period": "Q1"}'</text>
  <!-- response -->
  <text x="20" y="148" fill="#6c7086">{</text>
  <text x="20" y="166" fill="#6c7086">  "job_id": </text><text x="110" y="166" fill="#a6e3a1">"3fa85f64-5717-4562-b3fc-2c963f66afa6"</text>
  <text x="20" y="184" fill="#6c7086">}</text>
  <!-- poll -->
  <text x="20" y="216" fill="#a6e3a1">$</text>
  <text x="32" y="216" fill="#cdd6f4">curl http://localhost:8000/v1/reports/3fa85f64-5717-4562-b3fc-2c963f66afa6</text>
  <!-- response -->
  <text x="20" y="248" fill="#6c7086">{</text>
  <text x="20" y="266" fill="#6c7086">  "status": </text><text x="104" y="266" fill="#a6e3a1">"done"</text><text x="144" y="266" fill="#6c7086">,  "latency_s": </text><text x="268" y="266" fill="#fab387">165.3</text><text x="298" y="266" fill="#6c7086">,  "cost_usd": </text><text x="390" y="266" fill="#fab387">1.18</text><text x="414" y="266" fill="#6c7086">,</text>
  <text x="20" y="284" fill="#6c7086">  "verdict_counts": {"supported": </text><text x="228" y="284" fill="#a6e3a1">12</text><text x="242" y="284" fill="#6c7086">, "contradicted": </text><text x="356" y="284" fill="#f38ba8">1</text><text x="366" y="284" fill="#6c7086">, "unverifiable": </text><text x="488" y="284" fill="#f9e2af">3</text><text x="498" y="284" fill="#6c7086">}</text>
  <text x="20" y="302" fill="#6c7086">}</text>
</svg>
