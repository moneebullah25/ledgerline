# §12: a PR touching retrieval, extraction or the verification graph is blocked if L2
# contradiction precision drops more than 2 points (absolute) below main's baseline.
name: eval-gate
on:
  pull_request:
    paths:
      - "ledgerline/graph/**"
      - "ledgerline/extract/**"
      - "ledgerline/store/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  l2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: ledgerline, POSTGRES_PASSWORD: ledgerline, POSTGRES_DB: ledgerline}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerline" --health-interval 2s --health-retries 30
    env:
      LEDGERLINE_DATABASE_URL: postgresql+psycopg://ledgerline:ledgerline@localhost:5432/ledgerline
      LEDGERLINE_SEC_USER_AGENT: Ledgerline CI ci@example.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3
        with: {enable-cache: true}
      - run: uv sync --frozen --extra ml
      - run: uv run alembic upgrade head
      # Compare against the baseline on the base branch, so a PR cannot lower its own bar.
      # base_ref goes through env, never interpolated into the script (injection).
      - run: git show "origin/${BASE_REF}:ledgerline/evals/baseline.json" > "$RUNNER_TEMP/baseline.json"
        env:
          BASE_REF: ${{ github.base_ref }}
      # The model key is visible to this step only, not to dependency installs or migrations.
      - id: gate
        run: uv run python -m ledgerline.evals.gate --baseline "$RUNNER_TEMP/baseline.json" --out eval-gate.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Post per-claim verdict diff
        if: always() && hashFiles('eval-gate.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file eval-gate.md --edit-last --create-if-none
